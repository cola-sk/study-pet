<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Study Pet preview</title><style>body{font:16px system-ui;background:#dce5da;display:grid;place-items:center;min-height:100vh;margin:0}.device{width:240px;height:320px;background:#fff7e7;position:relative;box-shadow:0 12px 40px #253b2530;overflow:hidden}.title,.balance{position:absolute;top:12px;font-size:14px}.title{left:8px}.balance{right:8px}.pet{position:absolute;top:102px;left:50px;width:140px;height:132px;cursor:pointer}.menu{position:absolute;left:15px;top:38px;width:210px;height:244px;box-sizing:border-box;border:1px solid #c6c6bd;border-radius:14px;background:#fffdf7;padding:12px;color:#27382e}.menu[hidden]{display:none}.info,.notice{font-size:14px;height:20px}.notice{color:#748477}button{display:block;width:172px;height:30px;margin:4px auto;color:white;border:0;border-radius:6px;cursor:pointer;font-size:14px}#feed{background:#728e62}#water{background:#658faa}#sleep{background:#8797ac}#pet-button{background:#c58574}#close{background:#89918c}</style></head><body><main class="device"><div class="title">Keep going!</div><div class="balance" id="balance">30 credits</div><img class="pet" id="pet" src="frames/idle_01.png" alt="Tap the husky to choose an action" role="button" tabindex="0"><section id="menu" class="menu" hidden><div class="info" id="menu-balance">Your credits: 30</div><div class="notice" id="notice">Choose an action</div><button id="feed">Feed &nbsp; 10</button><button id="water">Water &nbsp; 5</button><button id="sleep">Sleep &nbsp; FREE</button><button id="pet-button">Pet &nbsp; FREE</button><button id="close">Close</button></section></main><script>
let coins=30,action='idle',frame=0,cycles=0,needTicks=0,lastNeed=-1;
const pet=document.querySelector('#pet'),sleep=document.querySelector('#sleep'),menu=document.querySelector('#menu'),notice=document.querySelector('#notice');
const needs=['hungry','thirsty','sleepy','lonely'];
function setAction(next){action=next;frame=0;cycles=0;pet.src=`frames/${action}_01.png`;sleep.textContent=action==='sleep'?'Wake up   FREE':'Sleep   FREE'}
const busy=()=>['eat','drink','pet','happy'].includes(action);
function openMenu(){if(busy())return;document.querySelector('#menu-balance').textContent=`Your credits: ${coins}`;notice.textContent='Choose an action';menu.hidden=false}
pet.addEventListener('click',openMenu);pet.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openMenu()}});
setInterval(()=>{if(!menu.hidden)return;frame=(frame+1)%4;if(frame===0){cycles++;if(['eat','drink','pet'].includes(action)&&cycles>=2){setAction('happy');return}if(action==='happy'&&cycles>=2){setAction('idle');needTicks=0;return}}if(['idle','hungry','thirsty','sleepy','lonely'].includes(action)&&++needTicks>=100){let pick=Math.floor(Math.random()*4);if(pick===lastNeed)pick=(pick+1+Math.floor(Math.random()*3))%4;lastNeed=pick;setAction(needs[pick]);needTicks=0;return}pet.src=`frames/${action}_${String(frame+1).padStart(2,'0')}.png`},300);
function spend(water){const cost=water?5:10;if(coins<cost){notice.textContent='Not enough credits';return}coins-=cost;document.querySelector('#balance').textContent=`${coins} credits`;menu.hidden=true;setAction(water?'drink':'eat')}
document.querySelector('#feed').addEventListener('click',()=>spend(false));document.querySelector('#water').addEventListener('click',()=>spend(true));sleep.addEventListener('click',()=>{menu.hidden=true;setAction(action==='sleep'?'idle':'sleep');needTicks=0});document.querySelector('#pet-button').addEventListener('click',()=>{menu.hidden=true;setAction('pet')});document.querySelector('#close').addEventListener('click',()=>{menu.hidden=true});
</script></body></html>
