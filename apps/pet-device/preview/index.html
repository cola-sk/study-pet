<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>小二哈设备预览</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eae8e1;font:14px system-ui,sans-serif;display:grid;justify-content:center;gap:16px;padding:24px}.device{position:relative;width:240px;height:320px;background:#fff7e7;overflow:hidden;box-shadow:0 5px 24px #0002;border-radius:8px}.title{position:absolute;left:8px;top:12px}.balance{position:absolute;right:4px;top:2px;width:112px;height:36px;border:0;background:none;text-align:right;color:#433c32;padding:0 4px;cursor:pointer}.balance small{display:block;font-size:12px;margin-top:2px}.pet{position:absolute;width:140px;height:132px;left:50px;top:102px;cursor:pointer}.action{position:absolute;width:46px;height:40px;border:0;border-radius:16px;padding:4px 1px 3px;cursor:pointer;color:white;box-shadow:0 2px 4px #0002}.action span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12px;line-height:14px}.action small{display:block;font-size:10px;line-height:12px;margin-top:3px}.notice{position:absolute;bottom:1px;width:100%;text-align:center;font-size:12px;color:#9c4938;pointer-events:none}.controls{max-width:320px;line-height:1.6;color:#484b40}.controls button{padding:8px 10px;border:1px solid #bfc2b4;border-radius:8px;background:white;margin:3px;cursor:pointer}[hidden]{display:none!important}
</style>
<main class="device"><div class="title">Keep going!</div><button class="balance" id="balance"><span id="credits">30 credits</span><small id="sync">Tap to sync</small></button><img class="pet" id="pet" src="frames/idle_01.png" alt="点击小二哈" role="button" tabindex="0"><div id="actions" hidden></div><div class="notice" id="notice" hidden></div></main>
<aside class="controls">设备页面预览，使用模拟商品与余额。<br><button id="two">只显示内置商品</button><button id="ten">预览 10 个商品</button></aside>
<script>
let coins=30,action='idle',frame=0,cycles=0,needTicks=0,lastNeed=-1;
const defaults=[{name:'Water',price:1,action:'drink'},{name:'Food',price:2,action:'eat'}];
let products=[...defaults];window.setCatalog=items=>{if(items.length>10)throw Error('最多10个商品');products=items;render()};
const pet=document.querySelector('#pet'),actions=document.querySelector('#actions'),notice=document.querySelector('#notice');
const needs=['hungry','thirsty','sleepy','lonely'];
function setAction(next){action=next;frame=next==='sleepy'?1:0;cycles=0;pet.src=`frames/${action}_${String(frame+1).padStart(2,'0')}.png`}
const busy=()=>['eat','drink','pet','happy'].includes(action);
function setMenu(open){actions.hidden=!open;notice.hidden=true;if(open)render()}
function openMenu(){if(!busy())setMenu(actions.hidden)}
function render(){actions.replaceChildren();const all=[...products,{name:action==='sleep'?'Wake':'Sleep',price:null,action:'sleep'},{name:'Pet',price:null,action:'pet'}];all.forEach((item,i)=>{let angle=-Math.PI/2+Math.PI*2*i/all.length;const button=document.createElement('button');button.className='action';button.style.left=(120+Math.trunc(93*Math.cos(angle))-23)+'px';button.style.top=(175+Math.trunc(110*Math.sin(angle))-20)+'px';button.style.background=({eat:'#728e62',drink:'#658faa',pet:'#c58574',happy:'#b88843',sleep:'#8797ac'})[item.action];const name=document.createElement('span');name.textContent=item.name;const price=document.createElement('small');price.textContent=item.price===null?'FREE':item.price+' cr';button.append(name,price);button.title=item.name;button.onclick=()=>{if(item.price!==null&&coins<item.price){notice.textContent='Not enough credits';notice.hidden=false;return}if(item.price!==null)coins-=item.price;document.querySelector('#credits').textContent=coins+' credits';setMenu(false);setAction(item.action==='sleep'?(action==='sleep'?'idle':'sleep'):item.action);needTicks=0};actions.append(button)})}
pet.onclick=openMenu;pet.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openMenu()}};
setInterval(()=>{if(!actions.hidden)return;const isNeed=needs.includes(action);if(!isNeed)frame=(frame+1)%4;if(!isNeed&&frame===0){cycles++;if(['eat','drink','pet'].includes(action)&&cycles>=2){setAction('happy');return}if(action==='happy'&&cycles>=2){setAction('idle');needTicks=0;return}}if(isNeed&&needTicks>0&&needTicks%4===0){const base=action==='sleepy'?1:0;frame=base+(frame===base?1:0)}if((action==='idle'||isNeed)&&++needTicks>=100){let pick=Math.floor(Math.random()*4);if(pick===lastNeed)pick=(pick+1+Math.floor(Math.random()*3))%4;lastNeed=pick;setAction(needs[pick]);needTicks=0;return}pet.src=`frames/${action}_${String(frame+1).padStart(2,'0')}.png`},300);
document.querySelector('#balance').onclick=()=>{document.querySelector('#sync').textContent='Syncing...';setTimeout(()=>{document.querySelector('#sync').textContent='Synced';setTimeout(()=>document.querySelector('#sync').textContent='Tap to sync',1500)},300)};
document.querySelector('#two').onclick=()=>{window.setCatalog([...defaults]);setMenu(true)};
document.querySelector('#ten').onclick=()=>{window.setCatalog([...defaults,...['月亮饼干','快乐魔法','宇宙汽水','抱抱券','勇气糖果','梦想点心','星光礼物','彩虹能量'].map((name,i)=>({name,price:i===7?10000:i+3,action:['eat','happy','drink','pet'][i%4]}))]);setMenu(true)};
</script></html>
