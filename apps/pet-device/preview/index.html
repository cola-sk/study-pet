<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Study Pet preview</title><style>body{font:16px system-ui;background:#dce5da;display:grid;place-items:center;min-height:100vh;margin:0}.device{width:240px;height:320px;background:#fff7e7;position:relative;text-align:center;box-shadow:0 12px 40px #253b2530;overflow:hidden}.title{position:absolute;top:12px;width:100%;font-size:14px}.balance{position:absolute;top:38px;width:100%;font-size:14px}.pet{position:absolute;top:65px;left:50px;width:140px;height:132px}.message{position:absolute;top:210px;width:100%;font-size:14px}button{position:absolute;bottom:20px;width:100px;height:48px;color:white;border:0;border-radius:8px;cursor:pointer;font-size:14px}#feed{left:15px;background:#728e62}#sleep{right:15px;background:#8797ac}</style></head><body><main class="device"><div class="title">STUDY PET</div><div class="balance" id="balance">Coins: 30</div><img class="pet" id="pet" src="frames/idle_01.png" alt="Husky puppy"><div class="message" id="message">Hello, friend!</div><button id="feed">Feed -10</button><button id="sleep">Sleep</button></main><script>
let coins=30,action='idle',frame=0,cycles=0;
const pet=document.querySelector('#pet'),message=document.querySelector('#message'),sleep=document.querySelector('#sleep');
function setAction(next){action=next;frame=0;cycles=0;pet.src=`frames/${action}_01.png`;sleep.textContent=action==='sleep'?'Wake up':'Sleep'}
setInterval(()=>{frame=(frame+1)%4;if(frame===0){cycles++;if(action==='eat'&&cycles>=2){setAction('happy');return}if(action==='happy'&&cycles>=2){setAction('idle');message.textContent='Hello, friend!';return}}pet.src=`frames/${action}_${String(frame+1).padStart(2,'0')}.png`},300);
document.querySelector('#feed').addEventListener('click',()=>{if(action==='eat'||action==='happy')return;if(coins<10){message.textContent='Not enough coins';return}coins-=10;document.querySelector('#balance').textContent=`Coins: ${coins}`;message.textContent='Yummy! Thank you!';setAction('eat')});
sleep.addEventListener('click',()=>{if(action==='eat'||action==='happy')return;let next=action==='sleep'?'idle':'sleep';setAction(next);message.textContent=next==='sleep'?'Good night!':'Hello, friend!'});
</script></body></html>
