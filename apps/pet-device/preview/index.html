<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Study Pet preview</title><style>body{font:16px system-ui;background:#dce5da;display:grid;place-items:center;min-height:100vh;margin:0}.device{width:240px;height:320px;background:#fff7e7;position:relative;box-shadow:0 12px 40px #253b2530;overflow:hidden}.title,.balance{position:absolute;top:12px;font-size:14px}.title{left:8px}.balance{right:8px}.pet{position:absolute;top:102px;left:50px;width:140px;height:132px;cursor:pointer}.actions[hidden],.notice[hidden]{display:none}.action{position:absolute;width:64px;height:64px;color:white;border:0;border-radius:50%;cursor:pointer;font-size:14px;line-height:18px;box-shadow:0 3px 7px #344c3330}.action small{display:block;font-size:11px}#feed{left:88px;top:39px;background:#728e62}#water{left:5px;top:136px;background:#658faa}#sleep{left:171px;top:136px;background:#8797ac}#pet-button{left:88px;top:237px;background:#c58574}.notice{position:absolute;bottom:1px;width:100%;text-align:center;font-size:14px;color:#9c4938}</style></head><body><main class="device"><div class="title">Keep going!</div><div class="balance" id="balance">30 credits</div><img class="pet" id="pet" src="frames/idle_01.png" alt="Tap the husky to choose an action" role="button" tabindex="0"><div id="actions" class="actions" hidden><button class="action" id="feed">Feed<small>10 cr</small></button><button class="action" id="water">Water<small>5 cr</small></button><button class="action" id="sleep">Sleep<small>FREE</small></button><button class="action" id="pet-button">Pet<small>FREE</small></button></div><div class="notice" id="notice" hidden>Not enough credits</div></main><script>
let coins=30,action='idle',frame=0,cycles=0,needTicks=0,lastNeed=-1;
const pet=document.querySelector('#pet'),sleep=document.querySelector('#sleep'),actions=document.querySelector('#actions'),notice=document.querySelector('#notice');
const needs=['hungry','thirsty','sleepy','lonely'];
function setAction(next){action=next;frame=next==='sleepy'?1:0;cycles=0;pet.src=`frames/${action}_${String(frame+1).padStart(2,'0')}.png`;sleep.innerHTML=(action==='sleep'?'Wake':'Sleep')+'<small>FREE</small>'}
const busy=()=>['eat','drink','pet','happy'].includes(action);
function setMenu(open){actions.hidden=!open;notice.hidden=true}
function openMenu(){if(!busy())setMenu(actions.hidden)}
pet.addEventListener('click',openMenu);pet.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openMenu()}});
setInterval(()=>{if(!actions.hidden)return;const isNeed=['hungry','thirsty','sleepy','lonely'].includes(action);if(!isNeed)frame=(frame+1)%4;if(!isNeed&&frame===0){cycles++;if(['eat','drink','pet'].includes(action)&&cycles>=2){setAction('happy');return}if(action==='happy'&&cycles>=2){setAction('idle');needTicks=0;return}}if(['idle','hungry','thirsty','sleepy','lonely'].includes(action)&&++needTicks>=100){let pick=Math.floor(Math.random()*4);if(pick===lastNeed)pick=(pick+1+Math.floor(Math.random()*3))%4;lastNeed=pick;setAction(needs[pick]);needTicks=0;return}pet.src=`frames/${action}_${String(frame+1).padStart(2,'0')}.png`},300);
function spend(water){const cost=water?5:10;if(coins<cost){notice.hidden=false;return}coins-=cost;document.querySelector('#balance').textContent=`${coins} credits`;setMenu(false);setAction(water?'drink':'eat')}
document.querySelector('#feed').addEventListener('click',()=>spend(false));document.querySelector('#water').addEventListener('click',()=>spend(true));sleep.addEventListener('click',()=>{setMenu(false);setAction(action==='sleep'?'idle':'sleep');needTicks=0});document.querySelector('#pet-button').addEventListener('click',()=>{setMenu(false);setAction('pet')});
</script></body></html>
