<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>小二哈设备预览</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eae8e1;font:14px system-ui,sans-serif;display:grid;justify-content:center;gap:16px;padding:24px}.device{position:relative;width:240px;height:320px;background:#fff7e7;overflow:hidden;box-shadow:0 5px 24px #0002;border-radius:8px}.title{position:absolute;left:8px;top:12px}.balance{position:absolute;right:4px;top:2px;width:112px;height:36px;border:0;background:none;text-align:right;color:#433c32;padding:0 4px;cursor:pointer}.balance small{display:block;font-size:12px;margin-top:2px}.pet{position:absolute;width:140px;height:132px;left:50px;top:102px;cursor:pointer}.action{position:absolute;width:84px;height:52px;border:0;border-radius:16px;padding:9px 4px 7px;cursor:pointer;color:white;box-shadow:0 2px 4px #0002}.action span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px;line-height:16px}.action small{display:block;font-size:10px;line-height:12px;margin-top:7px}.notice{position:absolute;left:6px;bottom:7px;width:160px;text-align:left;font-size:12px;color:#9c4938;pointer-events:none}.controls{max-width:320px;line-height:1.6;color:#484b40}.controls button{padding:8px 10px;border:1px solid #bfc2b4;border-radius:8px;background:white;margin:3px;cursor:pointer}.tasks-home{position:absolute;right:6px;bottom:6px;width:64px;height:64px;background:#728e62;color:white;border:0;border-radius:50%;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font:14px system-ui}.tasks-home small{font-size:10px;line-height:12px}.tasks-preview{position:absolute;inset:0;z-index:15;background:#fff7e7;color:#433c32;padding:6px}.tasks-preview button{border:0;border-radius:12px;background:#728e62;color:white;cursor:pointer;padding:8px}.tasks-header{display:flex;align-items:center;gap:10px;height:34px}.tasks-header .refresh{margin-left:auto}.tasks-summary{height:28px;padding-top:7px}.tasks-content{height:199px;overflow:auto;background:white;border-radius:10px;padding:6px}.tasks-row{display:block;width:100%;height:60px;background:#f5ead8!important;color:#433c32!important;text-align:left;margin-bottom:6px;overflow:hidden}.tasks-row span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tasks-row small{display:block;margin-top:7px}.tasks-detail{white-space:pre-wrap;line-height:1.55}.tasks-footer{position:absolute;bottom:10px;left:10px;right:10px;display:flex;justify-content:space-between;align-items:center}.tasks-footer .complete{width:220px;height:40px}.tasks-footer button:disabled{opacity:.5;cursor:default}[hidden]{display:none!important}
.settings-preview{position:absolute;inset:0;z-index:20;background:#fff7e7;color:#433c32}.settings-preview header{display:flex;gap:10px;align-items:center;height:44px;padding:4px 6px}.settings-preview button{border:0;border-radius:12px;background:#728e62;color:white;cursor:pointer;font:14px system-ui;padding:8px}.settings-preview header button{width:40px;height:36px;font-size:24px;padding:0}.settings-card{position:absolute;left:12px;width:216px;padding:8px 12px;border-radius:12px;background:white}.settings-value{margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.settings-card:first-of-type .settings-value{font-size:20px}.settings-card small{display:block;font-size:10px;margin-top:8px;max-width:98px}.settings-card .preview-sync{position:absolute;right:12px;bottom:8px;width:88px;height:36px}.settings-details{white-space:pre-line;margin:28px 16px;font-size:14px}.preview-current{white-space:pre-line;margin:4px 12px;font-size:12px;line-height:24px}.preview-wifi-controls{display:flex;gap:8px;margin:12px}.preview-wifi-controls button{width:104px;height:38px}.preview-networks{position:absolute;top:144px;bottom:6px;left:12px;width:216px;overflow:auto}.preview-networks button{display:block;width:100%;background:white;color:#433c32;text-align:left;margin-bottom:8px;min-height:54px}.preview-join{display:grid;gap:6px;margin:0 12px}.preview-join input{width:100%;height:34px;border:1px solid #d8d5cf;border-radius:6px;padding:6px;font-size:14px}.preview-password{display:flex;gap:8px}.preview-password input{width:152px}.preview-password button{width:56px;font-size:12px;padding:4px}.preview-join small{font-size:11px;line-height:16px;color:#676357;margin-top:12px}.preview-progress{position:absolute;left:24px;top:224px;width:192px;height:42px}
</style>
<main class="device"><div class="title">Keep going!</div><button class="balance" id="balance"><span id="credits">30 credits</span><small id="sync">Tap to sync</small></button><img class="pet" id="pet" src="frames/idle_01.png" alt="点击小二哈" role="button" tabindex="0"><div id="actions" hidden></div><button id="tasks-home" class="tasks-home"><span>Today</span><small>0/3</small></button><div class="notice" id="notice" hidden></div></main>
<aside class="controls">设备页面预览，使用模拟商品与余额。<br><button id="two">只显示内置商品</button><button id="three">加一个 Cookie</button><button id="ten">预览 10 个商品</button></aside>
<script src="action-layout.js"></script>
<script src="pet-profiles.js"></script>
<script src="pet-behavior.js"></script>
<script>
let coins=30,action='idle',frame=0,cycles=0,expressionTicks=0;
const defaults=[{name:'Water',price:1,action:'drink'},{name:'Food',price:2,action:'eat'}];
let products=[...defaults];window.setCatalog=items=>{if(items.length>10)throw Error('最多10个商品');products=items;render()};
const pet=document.querySelector('#pet'),actions=document.querySelector('#actions'),notice=document.querySelector('#notice');
const needs=['hungry','thirsty','sleepy','lonely'];
function setAction(next){action=next;frame=next==='sleepy'?1:0;cycles=0;expressionTicks=0;pet.src=`frames/${action}_${String(frame+1).padStart(2,'0')}.png`}
const busy=()=>['eat','drink','pet','happy'].includes(action);
function setMenu(open){actions.hidden=!open;document.querySelector('#tasks-home').hidden=open;notice.hidden=true;pet.style.transform=open?'scale(.5625)':'';if(open)render()}
function openMenu(){if(!busy())setMenu(actions.hidden)}
function render(){actions.replaceChildren();const all=[...products,{name:action==='sleep'?'Wake':'Sleep',price:null,action:'sleep'},{name:'Pet',price:null,action:'pet'}];all.forEach((item,i)=>{const box=actionBounds(all.length,i);const button=document.createElement('button');button.className='action';button.style.left=box.x+'px';button.style.top=box.y+'px';button.style.width=box.width+'px';button.style.height=box.height+'px';button.style.padding=all.length<=6?'9px 4px 7px':'6px 4px 5px';button.style.background=({eat:'#728e62',drink:'#658faa',pet:'#c58574',happy:'#b88843',sleep:'#8797ac'})[item.action];const name=document.createElement('span');name.textContent=item.name;const price=document.createElement('small');price.textContent=item.price===null?'FREE':item.price+' cr';button.append(name,price);button.title=item.name;button.onclick=()=>{if(item.price!==null&&coins<item.price){notice.textContent='Not enough credits';notice.hidden=false;return}if(item.price!==null)coins-=item.price;document.querySelector('#credits').textContent=coins+' credits';setMenu(false);if(item.action==='sleep')previewPet.toggleSleep();else if(['eat','drink','pet'].includes(item.action))previewPet.care(item.action);setAction(item.action==='sleep'?previewPet.mood():item.action)};actions.append(button)})}
pet.onclick=openMenu;pet.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openMenu()}};
setInterval(()=>{previewPet.tick();if(window.displayPreview?.asleep||!actions.hidden||document.querySelector('#settings')?.hidden===false||document.querySelector('#tasks-preview')?.hidden===false)return;if(!busy()&&action!==previewPet.mood())setAction(previewPet.mood());const isNeed=needs.includes(action);if(!isNeed)frame=(frame+1)%4;if(!isNeed&&frame===0){cycles++;if(['eat','drink','pet'].includes(action)&&cycles>=2){setAction('happy');return}if(action==='happy'&&cycles>=2){setAction(previewPet.mood());return}}if(isNeed&&++expressionTicks%4===0){const base=action==='sleepy'?1:0;frame=base+(frame===base?1:0)}pet.src=`frames/${action}_${String(frame+1).padStart(2,'0')}.png`},300);
document.querySelector('#balance').onclick=()=>{document.querySelector('#sync').textContent='Syncing...';setTimeout(()=>{document.querySelector('#sync').textContent='Synced';setTimeout(()=>document.querySelector('#sync').textContent='Tap to sync',1500)},300)};
document.querySelector('#two').onclick=()=>{window.setCatalog([...defaults]);setMenu(true)};
document.querySelector('#three').onclick=()=>{window.setCatalog([...defaults,{name:'Cookie',price:1,action:'eat'}]);setMenu(true)};
document.querySelector('#ten').onclick=()=>{window.setCatalog([...defaults,...['月亮饼干','快乐魔法','宇宙汽水','抱抱券','勇气糖果','梦想点心','星光礼物','彩虹能量'].map((name,i)=>({name,price:i===7?10000:i+3,action:['eat','happy','drink','pet'][i%4]}))]);setMenu(true)};
</script><script src="display.js"></script><script src="settings.js"></script><script src="tasks.js"></script></html>
